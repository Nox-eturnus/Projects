# The edge Worker (surface EDGE) — see docs/phase_C3_calendar.md for the
# full setup runbook. Deploy with `pnpm edge:deploy` from Life_Helper/.
#
# Secrets are never in this file. They're set with `wrangler secret put`,
# persist across deploys, and are never readable back out:
#   GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN  — `pnpm calendar:connect`
#   DEVICE_TOKEN                                — `pnpm edge:device-key`

name = "life-helper-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Free plan only (Decision 11). No bindings yet: no KV, no D1, no cron —
# Part D1 adds D1 for sync; Part H3 adds the one cron trigger.
workers_dev = true

[vars]
# Not secrets: an OAuth client ID is public by design, and so is which
# origins may call this Worker.
GOOGLE_CLIENT_ID = "216618425311-mrf14n2pet8t5j50fh4clvo6u0fqmjat.apps.googleusercontent.com"
ALLOWED_ORIGINS = "https://life-helper.pages.dev,http://localhost:5173"
