name: Adaptive QKD Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies and editable package
      run: |
        python -m pip install --upgrade pip
        if [ -d "adaptive-qkd-network-testbed" ]; then
          cd adaptive-qkd-network-testbed
        fi
        pip install -r requirements.txt
        pip install -e .

    - name: Run unit test suite
      run: |
        if [ -d "adaptive-qkd-network-testbed" ]; then
          cd adaptive-qkd-network-testbed
        fi
        pytest -v

    - name: Run end-to-end closed loop test
      run: |
        if [ -d "adaptive-qkd-network-testbed" ]; then
          cd adaptive-qkd-network-testbed
        fi
        python scripts/26_end_to_end_closed_loop.py
