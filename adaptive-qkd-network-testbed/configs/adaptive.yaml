# Adaptive QKD Policy and Trajectory Configuration
trajectories:
  num_trajectories: 96
  steps_per_trajectory: 8
  random_seed: 2026
  drift_sigma_qber: 0.003
  attack_probability: 0.35
  burst_probability: 0.35
  burst_demand_bps: 80000
  normal_demand_bps: 12000
  switching_penalty_utility: 50.0

evaluation:
  bootstrap_resamples: 1000
  confidence_level: 0.95
  train_trajectory_split_modulo: 4  # Trajectories with id % 4 == 0 are held-out test trajectories

baselines:
  - id: "fixed_bb84_conservative"
    protocol: "decoy_bb84"
    mu: 0.40
    nu: 0.05
    p: 0.80
    n: 10000000000
  - id: "fixed_bb84_aggressive"
    protocol: "decoy_bb84"
    mu: 0.55
    nu: 0.10
    p: 0.90
    n: 10000000000
  - id: "fixed_mdi"
    protocol: "mdi_qkd"
    mu: 0.40
    nu: 0.05
    p: 0.80
    n: 10000000000
  - id: "training_optimal_fixed"
    description: "Best single fixed action chosen on training set"
  - id: "heuristic_policy"
    description: "Rule-based expert heuristic (QBER and distance thresholds)"
  - id: "abort_baseline"
    description: "Always safe zero-key abort"
