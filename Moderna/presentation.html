<h2 id="the-problem-np-hard-pseudoknot-prediction">The Problem: NP-Hard Pseudoknot Prediction</h2>
<p><strong>RNA secondary structure</strong> determines biological function — but predicting it computationally is hard.</p>
<ul>
<li><strong>Nested structures</strong> (hairpins, stems): solvable in <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="5.906ex" height="2.451ex" role="img" focusable="false" viewBox="0 -833.2 2610.6 1083.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="4F" d="M308 428Q289 428 289 438Q289 457 318 508T378 593Q417 638 475 671T599 705Q688 705 732 643T777 483Q777 380 733 285T620 123T464 18T293 -22Q188 -22 123 51T58 245Q58 327 87 403T159 533T249 626T333 685T388 705Q404 705 404 693Q404 674 363 649Q333 632 304 606T239 537T181 429T158 290Q158 179 214 114T364 48Q489 48 583 165T677 438Q677 473 670 505T648 568T601 617T528 636Q518 636 513 635Q486 629 460 600T419 544T392 490Q383 470 372 459Q341 430 308 428Z"></path></g></g><g data-mml-node="mo" transform="translate(796,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="msup" transform="translate(1185,0)"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mn" transform="translate(633,363) scale(0.7 <h2 id="future-directions">Future Directions</h2>
<ol>
<li><strong>Scalability to Long Sequences:</strong> Extend to 50–100+ nt RNA sequences using Tensor Network (MPS) statevector simulators.</li>
<li><strong>Real QPU Execution:</strong> Deploy optimized circuits on IBM Quantum hardware with Zero-Noise Extrapolation (ZNE) error mitigation.</li>
<li><strong>Multi-Loop Energy Penalties:</strong> Incorporate non-linear multi-loop junction penalties directly into the QUBO interaction matrix.</li>
<li><strong>Hybrid Warm-Starting:</strong> Initialize VQE parameters using classical SA/SBM solutions to accelerate convergence.</li>
<li><strong>Experimental 3D Validation:</strong> Benchmark against PDB/NDB experimentally determined 3D pseudoknot coordinates.</li>
</ol>
</section>
